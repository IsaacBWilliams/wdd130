<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Wave Packe -White Water Rafting</title>
    <meta name="description"
      content="This is the Contact us Page of Wave Pack, Here you can contact us, 'Wave Pack'! We want to hear your concerns">
    <meta name="author" content="Isaac Williams">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <!-- The Header -->
    <header>
        <img src="images/wwr-company-logo.png" alt="White Watter Rafting logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>


    </header>

    <!-- The Main -->
    <main>

        <div class="contact-info-box">

            <div class="info-box-1">
                <h1 id="contact-h1">Wave Pack Info</h1>
                <p>123 Main River Street</p>
                <p>South Jourdan, Utah</p>
                <p>+1 999 999 9999</p>
                <p>info@WavePack.com</p>
            </div>

            <form class="input-form">

                <div class="form-input">
                    <label for="fullname">Name: </label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-input">
                    <label for="user-email">Email: </label>
                    <input type="email" id="user-email" name="user-email" required>
                </div>

                <fieldset class="form-input message-purpose-box">

                    <legend>Message Purpose</legend>

                    <div>
                        <input type="radio" id="general-inquiry" name="message-purpose"
                          value="general-inquiry">
                        <label for="general-inquiry">General Inquiry</label><br>
                    </div>

                    <div>
                        <input type="radio" id="reservation-question" name="message-purpose"
                          value="reservation-question">
                        <label for="reservation-question">Reservation Question</label><br>
                    </div>

                    <div>
                        <input type="radio" id="website-suggestion" name="message-purpose"
                          value="website-suggestion">
                        <label for="website-suggestion">Website Suggestion</label>
                    </div>

                </fieldset>

                <label for="user-message">Message</label>
                <textarea id="user-message" name="user-message" rows="3"></textarea>

                <div class="form-input sub-check">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Contact Us</button>

                <!-- -->
            </form>

            <div class="info-map">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d192048.68516981436!2d-109.57172803323617!3d41.226984942546146!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1790639485520!5m2!1sen!2sus"
                  width="400" height="300" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>

            </div>
        </div>

        <div class="serve-you-box">
            <h2 id="contact-h2">We Are Here to Serve You</h2>

            <div class="employee-group">
                <img src="images/wwr-employee-image-1.png"
                  alt="A cartoon employee character smilling">
                <p>Anna Brown</p>
            </div>
            <div class="employee-group">
                <img src="images/wwr-employee-image-2.png"
                  alt="A cartoon employee character smilling">
                <p>James Arthour</p>
            </div>
            <div class="employee-group">
                <img src="images/wwr-employee-image-3.png"
                  alt="A cartoon employee character smilling">
                <p>Drake Bowers</p>
            </div>
        </div>

    </main>

    <!-- The Footer -->
    <footer>
        <p>&copy; 2026 🔥Wave Pack🔥 Isaac Williams</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/wwr-facebook-icon.png"
                  alt="facebook brand icon"></a>
            <a href="https://linkedin.com"><img src="images/wwr-linkedin-icon.png"
                  alt="linkedin brand icon"></a>
            <a href="https://instagram.com"><img src="images/wwr-instagram-icon.png"
                  alt="instagram brand icon"></a>
        </nav>
    </footer>
</body>

</html>
